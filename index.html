// ─── UTILS ───────────────────────────────────────────────
async function submitForm(data){
  if(false){
    const subj=encodeURIComponent(data.Subject||"Opulence Archive");
    const body=encodeURIComponent(Object.entries(data).map(([k,v])=>`${k}: ${v||"-"}`).join("\n"));
    window.open(`mailto:${EMAIL}?subject=${subj}&body=${body}`);
    return true;
  }
  try{const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({...data,"access_key":WEB3FORMS_KEY})});return r.ok;}
  catch{return false;}
}

function Input({value,onChange,placeholder,type="text",err=false,multiline=false,rows=4}){
  const cls=`input-field${err?" input-error":""}`;
  if(multiline)return<textarea value={value} onChange={onChange} placeholder={placeholder} rows={rows} className={cls} style={{resize:"none"}}/>;
  return<input type={type} value={value} onChange={onChange} placeholder={placeholder} className={cls}/>;
}
function Sel({value,onChange,opts,placeholder,err=false}){
  return<select value={value} onChange={onChange} className={`input-field${err?" input-error":""}`}><option value="">{placeholder}</option>{opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>;
}

        <button onClick={()=>setOpen(!open)} className="md:hidden" style={{background:"none",border:"1px solid rgba(255,255,255,0.1)",color:"#C9A84C",width:"40px",height:"40px",cursor:"pointer",fontSize:"18px"}}>{open?"×":"☰"}</button>

        </div>
      </div>}
    </nav>
  );
}

function FormPage({type,t,setPage}){
  const isSell=type==="sell";

  const langOpts=[["English",f.langEN],["German",f.langDE],["French",f.langFR]];

  const [d,setD]=useState({name:"",email:"",whatsapp:"",lang:"",cat:"",asset:"",budget:"",country:"",details:"",model:"",year:"",price:"",docs:"",company:false});
  const [status,setStatus]=useState("");
  const u=(k,v)=>setD(p=>({...p,[k]:v}));
  const required=isSell?["name","email","whatsapp","lang","cat","model","price","country"]:["name","email","whatsapp","lang","cat","budget","country"];
  const submit=async(e)=>{
    e.preventDefault();
    if(required.some(k=>!d[k])){setStatus("error");return;}
    setStatus("sending");
    const payload=isSell?{Subject:"Asset Submission – Opulence Archive",Name:d.name,Email:d.email,WhatsApp:d.whatsapp,Language:d.lang,Category:d.cat,"Brand/Model":d.model,"Year/Condition":d.year,Price:d.price,Country:d.country,Documents:d.docs,Details:d.details,Company:d.company?"Yes":"No"}:{Subject:"Sourcing Request – Opulence Archive",Name:d.name,Email:d.email,WhatsApp:d.whatsapp,Language:d.lang,Category:d.cat,"Brand/Model":d.asset,Budget:d.budget,Country:d.country,Details:d.details,Company:d.company?"Yes":"No"};
    const ok=await submitForm(payload);
    setStatus(ok?"success":"error");
    if(ok)setD({name:"",email:"",whatsapp:"",lang:"",cat:"",asset:"",budget:"",country:"",details:"",model:"",year:"",price:"",docs:"",company:false});
  };
  const err=k=>status==="error"&&required.includes(k)&&!d[k];
  const bg=isSell?IMG.sell:IMG.sourcing;
  return(
    <div className="page-enter" style={{paddingTop:"68px"}}>
      {/* Header image */}

        <img src={bg} alt="" style={{width:"100%",height:"100%",objectFit:"cover",opacity:0.4}}/>

          <h1 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"clamp(36px,5vw,60px)",color:"#fff"}}>{info.title}</h1>
        </div>
      </div>
      <div style={{maxWidth:"1200px",margin:"0 auto",padding:"60px 24px 100px"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"64px",alignItems:"start"}} className="md:grid-cols-2">
          {/* Left */}
          <div>
            <p style={{fontFamily:"Inter,sans-serif",fontSize:"15px",color:"rgba(255,255,255,0.5)",lineHeight:"1.9",marginBottom:"32px"}}>{info.sub}</p>
            <FeeBox text={info.fee}/>
            <div style={{marginTop:"40px",display:"grid",gap:"16px"}}>
              {CATS.map(({key,img})=>(
                <div key={key} onClick={()=>u("cat",t.cats[key])} style={{display:"flex",alignItems:"center",gap:"14px",padding:"12px 16px",border:`1px solid ${d.cat===t.cats[key]?"rgba(201,168,76,0.4)":"rgba(255,255,255,0.05)"}`,cursor:"pointer",transition:"all 0.2s ease",background:d.cat===t.cats[key]?"rgba(201,168,76,0.05)":"transparent"}}>
                  <img src={img} alt="" style={{width:"48px",height:"36px",objectFit:"cover",opacity:0.7}}/>
                  <span style={{fontFamily:"Inter,sans-serif",fontSize:"12px",letterSpacing:"0.1em",color:d.cat===t.cats[key]?"#C9A84C":"rgba(255,255,255,0.5)",textTransform:"uppercase"}}>{t.cats[key]}</span>
                  {d.cat===t.cats[key]&&<span style={{marginLeft:"auto",color:"#C9A84C",fontSize:"12px"}}>✓</span>}
                </div>
              ))}
            </div>
          </div>
          {/* Form */}
          <form onSubmit={submit} style={{display:"grid",gap:"14px",background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",padding:"36px"}}>

            <div className="gold-line" style={{width:"40px",marginBottom:"8px"}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
              <Input value={d.name} onChange={e=>u("name",e.target.value)} placeholder={f.name} err={err("name")}/>
              <Input type="email" value={d.email} onChange={e=>u("email",e.target.value)} placeholder={f.email} err={err("email")}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
              <Input value={d.whatsapp} onChange={e=>u("whatsapp",e.target.value)} placeholder={f.whatsapp} err={err("whatsapp")}/>
              <Sel value={d.lang} onChange={e=>u("lang",e.target.value)} opts={langOpts} placeholder={f.lang} err={err("lang")}/>
            </div>
            <Sel value={d.cat} onChange={e=>u("cat",e.target.value)} opts={catOpts} placeholder={isSell?f.assetCat:f.cat} err={err("cat")}/>
            {isSell?(
              <>
                <Input value={d.model} onChange={e=>u("model",e.target.value)} placeholder={f.model} err={err("model")}/>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
                  <Input value={d.year} onChange={e=>u("year",e.target.value)} placeholder={f.year}/>
                  <Input value={d.price} onChange={e=>u("price",e.target.value)} placeholder={f.price} err={err("price")}/>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
                  <Input value={d.country} onChange={e=>u("country",e.target.value)} placeholder={f.country} err={err("country")}/>
                  <Input value={d.docs} onChange={e=>u("docs",e.target.value)} placeholder={f.docs}/>
                </div>
                <Input value={d.details} onChange={e=>u("details",e.target.value)} placeholder={f.assetDetails} multiline rows={4}/>
              </>
            ):(
              <>
                <Input value={d.asset} onChange={e=>u("asset",e.target.value)} placeholder={f.asset}/>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
                  <Input value={d.budget} onChange={e=>u("budget",e.target.value)} placeholder={f.budget} err={err("budget")}/>
                  <Input value={d.country} onChange={e=>u("country",e.target.value)} placeholder={f.country} err={err("country")}/>
                </div>
                <Input value={d.details} onChange={e=>u("details",e.target.value)} placeholder={f.details} multiline rows={4}/>
              </>
            )}
            <label style={{display:"flex",alignItems:"center",gap:"10px",fontFamily:"Inter,sans-serif",fontSize:"13px",color:"rgba(255,255,255,0.4)",cursor:"pointer"}}>
              <input type="checkbox" checked={d.company} onChange={e=>u("company",e.target.checked)} style={{accentColor:"#C9A84C",width:"14px",height:"14px"}}/>{f.company}
            </label>
            {status==="error"&&<p style={{color:"#f87171",fontSize:"13px",fontFamily:"Inter,sans-serif"}}>{f.error}</p>}
            {status==="success"&&<p style={{color:"#C9A84C",fontSize:"13px",fontFamily:"Inter,sans-serif",border:"1px solid rgba(201,168,76,0.2)",background:"rgba(201,168,76,0.04)",padding:"12px 16px"}}>{f.success}</p>}
            <button type="submit" disabled={status==="sending"} className="btn-gold" style={{padding:"16px",fontSize:"12px",fontFamily:"Inter,sans-serif",letterSpacing:"0.2em",textTransform:"uppercase",border:"none",cursor:"pointer",marginTop:"8px",opacity:status==="sending"?0.6:1}}>{status==="sending"?f.sending:isSell?f.submitAsset:f.submit}</button>
          </form>
        </div>
      </div>
    </div>
  );
}

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>

              <Input value={d.city} onChange={e=>u("city",e.target.value)} placeholder={f.city}/>
            </div>
            <Input value={d.interests} onChange={e=>u("interests",e.target.value)} placeholder={f.interests}/>
            <Input value={d.reason} onChange={e=>u("reason",e.target.value)} placeholder={f.reason} multiline rows={4}/>
            {status==="error"&&<p style={{color:"#f87171",fontSize:"13px",fontFamily:"Inter,sans-serif"}}>{f.error}</p>}
            {status==="success"&&<p style={{color:"#C9A84C",fontSize:"13px",fontFamily:"Inter,sans-serif",border:"1px solid rgba(201,168,76,0.2)",background:"rgba(201,168,76,0.04)",padding:"12px 16px"}}>{f.success}</p>}
            <button type="submit" disabled={status==="sending"} className="btn-gold" style={{padding:"16px",fontSize:"12px",fontFamily:"Inter,sans-serif",letterSpacing:"0.2em",textTransform:"uppercase",border:"none",cursor:"pointer",opacity:status==="sending"?0.6:1}}>{status==="sending"?f.sending:t.members.applyBtn}</button>
          </form>
        </div>
      </div>
    </div>
  );
}

function AboutPage({t,setPage}){
  return(
    <div className="page-enter" style={{paddingTop:"68px"}}>
      <div style={{position:"relative",height:"400px",overflow:"hidden"}}>
        <img src={IMG.about} alt="" style={{width:"100%",height:"100%",objectFit:"cover",opacity:0.35}}/>
        <div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,rgba(5,5,5,0.2),rgba(5,5,5,1))"}}/>
        <div style={{position:"absolute",bottom:"48px",left:"50%",transform:"translateX(-50%)",textAlign:"center",width:"100%",padding:"0 24px"}}>
          <p style={{fontFamily:"Inter,sans-serif",fontSize:"11px",letterSpacing:"0.4em",color:"#C9A84C",textTransform:"uppercase",marginBottom:"12px"}}>{t.about.label}</p>
          <h1 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"clamp(40px,6vw,72px)",color:"#fff"}}>{t.about.title}</h1>
        </div>
      </div>
      <div style={{maxWidth:"1200px",margin:"0 auto",padding:"80px 24px 100px"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"80px",alignItems:"start",marginBottom:"80px"}}>
          <div>
            <p style={{fontFamily:"Inter,sans-serif",fontSize:"16px",color:"rgba(255,255,255,0.55)",lineHeight:"2",marginBottom:"24px"}}>{t.about.p1}</p>
            <p style={{fontFamily:"Inter,sans-serif",fontSize:"16px",color:"rgba(255,255,255,0.55)",lineHeight:"2",marginBottom:"24px"}}>{t.about.p2}</p>
            <p style={{fontFamily:"Cormorant Garamond,serif",fontSize:"22px",color:"rgba(201,168,76,0.8)",fontStyle:"italic",lineHeight:"1.6"}}>{t.about.p3}</p>
          </div>
          <div style={{display:"grid",gap:"20px"}}>
            {t.about.values.map(v=>(
              <div key={v.t} className="glass card-hover" style={{padding:"28px 32px"}}>
                <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"22px",color:"#C9A84C",marginBottom:"10px"}}>{v.t}</h3>
                <p style={{fontFamily:"Inter,sans-serif",fontSize:"14px",color:"rgba(255,255,255,0.45)",lineHeight:"1.7"}}>{v.d}</p>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function ContactPage({t}){
  const f=t.form;
  const langOpts=[["English",f.langEN],["German",f.langDE],["French",f.langFR]];
  const [d,setD]=useState({name:"",email:"",whatsapp:"",lang:"",message:""});
  const [status,setStatus]=useState("");
  const u=(k,v)=>setD(p=>({...p,[k]:v}));
  const submit=async(e)=>{
    e.preventDefault();
    if(!d.name||!d.email){setStatus("error");return;}
    setStatus("sending");
    const ok=await submitForm({Subject:"Contact – Opulence Archive",...d});
    setStatus(ok?"success":"error");
    if(ok)setD({name:"",email:"",whatsapp:"",lang:"",message:""});
  };
  return(
    <div className="page-enter" style={{paddingTop:"68px"}}>
      <div style={{maxWidth:"1000px",margin:"0 auto",padding:"80px 24px 100px"}}>
        <div style={{textAlign:"center",marginBottom:"64px"}}>
          <p style={{fontFamily:"Inter,sans-serif",fontSize:"11px",letterSpacing:"0.4em",color:"#C9A84C",textTransform:"uppercase",marginBottom:"16px"}}>{t.contact.label}</p>
          <h1 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"clamp(36px,5vw,60px)",color:"#fff",marginBottom:"16px"}}>{t.contact.title}</h1>
          <div className="gold-line" style={{width:"48px",margin:"20px auto"}}/>
          <p style={{fontFamily:"Inter,sans-serif",fontSize:"15px",color:"rgba(255,255,255,0.4)",maxWidth:"440px",margin:"0 auto",lineHeight:"1.8"}}>{t.contact.sub}</p>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:"48px",alignItems:"start"}}>
          <div>
            <div style={{padding:"20px",border:"1px solid rgba(201,168,76,0.1)",background:"rgba(201,168,76,0.03)"}}>
              <p style={{fontFamily:"Inter,sans-serif",fontSize:"12px",color:"rgba(201,168,76,0.6)",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:"6px"}}>Switzerland</p>
              <p style={{fontFamily:"Inter,sans-serif",fontSize:"13px",color:"rgba(255,255,255,0.4)",lineHeight:"1.7"}}>{t.contact.privacy}</p>
            </div>
          </div>
          <form onSubmit={submit} style={{display:"grid",gap:"14px",background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",padding:"32px"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
              <Input value={d.name} onChange={e=>u("name",e.target.value)} placeholder={f.name} err={status==="error"&&!d.name}/>
              <Input type="email" value={d.email} onChange={e=>u("email",e.target.value)} placeholder={f.email} err={status==="error"&&!d.email}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
              <Input value={d.whatsapp} onChange={e=>u("whatsapp",e.target.value)} placeholder={f.whatsapp}/>
              <Sel value={d.lang} onChange={e=>u("lang",e.target.value)} opts={langOpts} placeholder={f.lang}/>
            </div>
            <Input value={d.message} onChange={e=>u("message",e.target.value)} placeholder="Message" multiline rows={5}/>
            {status==="error"&&<p style={{color:"#f87171",fontSize:"13px",fontFamily:"Inter,sans-serif"}}>{f.error}</p>}
            {status==="success"&&<p style={{color:"#C9A84C",fontSize:"13px",fontFamily:"Inter,sans-serif",border:"1px solid rgba(201,168,76,0.2)",background:"rgba(201,168,76,0.04)",padding:"12px 16px"}}>{f.success}</p>}
            <button type="submit" disabled={status==="sending"} className="btn-gold" style={{padding:"16px",fontSize:"12px",fontFamily:"Inter,sans-serif",letterSpacing:"0.2em",textTransform:"uppercase",border:"none",cursor:"pointer",opacity:status==="sending"?0.6:1}}>{status==="sending"?f.sending:f.submit}</button>
          </form>
        </div>
      </div>
    </div>
  );
}

function LegalPage({type,lang,t,setPage}){
  const titles={privacy:{EN:"Privacy Policy",DE:"Datenschutz",FR:"Confidentialité"},terms:{EN:"Terms & Conditions",DE:"AGB",FR:"Conditions"},cookies:{EN:"Cookie Policy",DE:"Cookies",FR:"Cookies"},disclaimer:{EN:"Disclaimer",DE:"Disclaimer",FR:"Disclaimer"}};
  const content={
    privacy:{EN:`Opulence Archive respects your privacy. Information collected may include names, emails and WhatsApp numbers. Data is used to process requests and communicate with clients. Users may request access or deletion via the contact form.`,DE:`Opulence Archive respektiert Ihre Privatsphäre. Erfasste Daten können Namen, E-Mails und WhatsApp-Nummern umfassen. Auskunft oder Löschung über das Kontaktformular.`,FR:`Opulence Archive respecte votre vie privée. Données collectées: noms, emails, WhatsApp. Demandes via le formulaire de contact.`},
    terms:{EN:"By using Opulence Archive, users agree to these terms. The platform operates as an independent luxury sourcing service. No guarantee is made regarding asset availability or transaction success. Swiss law applies.",DE:"Mit der Nutzung akzeptieren Nutzer diese AGB. Keine Garantie für Verfügbarkeit oder Transaktionserfolg. Schweizer Recht gilt.",FR:"En utilisant Opulence Archive, les utilisateurs acceptent ces conditions. Droit suisse applicable."},
    cookies:{EN:"This website uses cookies for analytics and functionality. Users may manage cookies through browser settings.",DE:"Diese Website verwendet Cookies. Verwaltung über Browser-Einstellungen möglich.",FR:"Ce site utilise des cookies. Gestion via les paramètres du navigateur."},
    disclaimer:{EN:"Opulence Archive is an independent platform not officially affiliated with any brands displayed. No guarantee is made regarding transactions. Not financial or legal advice.",DE:"Unabhängige Plattform ohne Markenverbindung. Keine Finanz- oder Rechtsberatung.",FR:"Plateforme indépendante. Pas de conseil juridique ou financier."},
  };
  return(
    <div className="page-enter" style={{paddingTop:"68px",minHeight:"100vh"}}>
      <div style={{maxWidth:"800px",margin:"0 auto",padding:"80px 24px 100px"}}>
        <button onClick={()=>setPage("home")} style={{fontFamily:"Inter,sans-serif",fontSize:"11px",letterSpacing:"0.2em",color:"#C9A84C",textTransform:"uppercase",background:"none",border:"none",cursor:"pointer",marginBottom:"48px",display:"block"}}>{t.back}</button>
        <h1 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"48px",color:"#C9A84C",marginBottom:"32px"}}>{titles[type][lang]||titles[type].EN}</h1>
        <div className="gold-line" style={{width:"48px",marginBottom:"32px"}}/>
        <p style={{fontFamily:"Inter,sans-serif",fontSize:"15px",color:"rgba(255,255,255,0.5)",lineHeight:"2"}}>{content[type][lang]||content[type].EN}</p>
      </div>
    </div>
  );
}

function Footer({t,setPage}){
  const pages=["privacy","terms","cookies","disclaimer"];
  return(
    <footer style={{borderTop:"1px solid rgba(255,255,255,0.04)",padding:"48px 24px"}}>
      <div style={{maxWidth:"1280px",margin:"0 auto"}}>
        <div style={{display:"flex",flexWrap:"wrap",justifyContent:"space-between",alignItems:"center",gap:"24px",marginBottom:"24px"}}>
          <span style={{fontFamily:"Cormorant Garamond,serif",color:"rgba(201,168,76,0.5)",fontSize:"14px",letterSpacing:"0.2em"}}>OPULENCE ARCHIVE</span>
          <div style={{display:"flex",gap:"24px",flexWrap:"wrap"}}>
            {t.footer.links.map((l,i)=><button key={l} onClick={()=>setPage(pages[i])} style={{fontFamily:"Inter,sans-serif",fontSize:"11px",letterSpacing:"0.15em",color:"rgba(255,255,255,0.25)",textTransform:"uppercase",background:"none",border:"none",cursor:"pointer",transition:"color 0.2s"}} onMouseEnter={e=>e.target.style.color="#C9A84C"} onMouseLeave={e=>e.target.style.color="rgba(255,255,255,0.25)"}>{l}</button>)}
          </div>
        </div>
        <div className="gold-line" style={{marginBottom:"24px",opacity:0.3}}/>
        <div style={{display:"flex",flexWrap:"wrap",justifyContent:"space-between",gap:"16px"}}>
          <p style={{fontFamily:"Inter,sans-serif",fontSize:"11px",color:"rgba(255,255,255,0.15)"}}>{t.footer.copy}</p>
          <p style={{fontFamily:"Inter,sans-serif",fontSize:"11px",color:"rgba(255,255,255,0.15)",maxWidth:"500px",lineHeight:"1.7"}}>{t.footer.note}</p>
        </div>
      </div>
    </footer>
  );
}

function CookieBanner({t,setPage,onAccept}){
  return(
    <div style={{position:"fixed",bottom:"20px",left:"50%",transform:"translateX(-50%)",zIndex:200,width:"92%",maxWidth:"600px",background:"rgba(10,10,10,0.95)",border:"1px solid rgba(255,255,255,0.08)",backdropFilter:"blur(24px)",padding:"20px 24px"}}>
      <div style={{display:"flex",gap:"20px",alignItems:"center",flexWrap:"wrap",justifyContent:"space-between"}}>
        <p style={{fontFamily:"Inter,sans-serif",fontSize:"13px",color:"rgba(255,255,255,0.45)",lineHeight:"1.6",flex:"1",minWidth:"200px"}}>{t.cookie.text}</p>
        <div style={{display:"flex",gap:"10px",shrink:0}}>
          <button onClick={()=>setPage("cookies")} style={{fontFamily:"Inter,sans-serif",fontSize:"11px",letterSpacing:"0.1em",color:"rgba(255,255,255,0.3)",background:"none",border:"1px solid rgba(255,255,255,0.1)",padding:"10px 16px",cursor:"pointer",textTransform:"uppercase"}}>{t.cookie.more}</button>
          <button onClick={onAccept} className="btn-gold" style={{fontFamily:"Inter,sans-serif",fontSize:"11px",letterSpacing:"0.1em",padding:"10px 20px",border:"none",cursor:"pointer",textTransform:"uppercase"}}>{t.cookie.accept}</button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [lang,setLang]=useState("EN");
  const [page,setPage]=useState("home");
  const [cookie,setCookie]=useState(false);
  const t=T[lang];

  useEffect(()=>{try{if(localStorage.getItem("oa-cookie-v3")==="1")setCookie(true);}catch(e){}});
  useEffect(()=>{window.scrollTo({top:0,behavior:"instant"});},[page]);

  const acceptCookie=()=>{try{localStorage.setItem("oa-cookie-v3","1");}catch(e){}setCookie(true);};

  const setPageAndScroll=(p)=>{setPage(p);window.scrollTo({top:0,behavior:"instant"});};

  const renderPage=()=>{
    if(page==="home")return<HomePage t={t} setPage={setPageAndScroll} lang={lang}/>;
    if(page==="sourcing")return<FormPage type="sourcing" t={t} setPage={setPageAndScroll}/>;
    if(page==="sell")return<FormPage type="sell" t={t} setPage={setPageAndScroll}/>;
    if(page==="members")return<MembersPage t={t} setPage={setPageAndScroll}/>;
    if(page==="about")return<AboutPage t={t} setPage={setPageAndScroll}/>;
    if(page==="contact")return<ContactPage t={t}/>;
    if(["privacy","terms","cookies","disclaimer"].includes(page))return<LegalPage type={page} lang={lang} t={t} setPage={setPageAndScroll}/>;
    return<HomePage t={t} setPage={setPageAndScroll} lang={lang}/>;
  };

  return(
    <div style={{minHeight:"100vh",background:"#050505"}}>
      <Navbar lang={lang} setLang={setLang} page={page} setPage={setPageAndScroll} t={t}/>
      {renderPage()}
      <Footer t={t} setPage={setPageAndScroll}/>
      {!cookie&&<CookieBanner t={t} setPage={setPageAndScroll} onAccept={acceptCookie}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
