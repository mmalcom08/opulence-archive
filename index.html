async function submitForm(data){
  if(false){
    const subj=encodeURIComponent(data.Subject||"Opulence Archive");
    const body=encodeURIComponent(Object.entries(data).map(([k,v])=>`${k}: ${v||"-"}`).join("\n"));
    window.open(`mailto:${EMAIL}?subject=${subj}&body=${body}`);
    return true;
  }
  try{const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({...data,"access_key":WEB3FORMS_KEY})});return r.ok;}
  catch{return false;}
}

function PhoneInput({value,onChange,placeholder,err=false}){
  const splitPhone=(v)=>{
    const hit=COUNTRY_CODES.find(c=>v&&v.startsWith(c[2]+" "));
    return hit?[hit[2],v.slice(hit[2].length+1)]:["+41",v||""];
  };
  const [code,number]=splitPhone(value);
  const setCode=(c)=>onChange((number?c+" "+number:c+" "));
  const setNumber=(n)=>onChange((code||"+41")+" "+n);
  return(
    <div className="phone-row-force">
      <select value={code} onChange={e=>setCode(e.target.value)} className={`input-field phone-code-force${err?" input-error":""}`}>
        {COUNTRY_CODES.map(([flag,iso,dial],i)=><option key={iso+dial+i} value={dial}>{flag} {iso} {dial}</option>)}
      </select>
      <input type="tel" value={number} onChange={e=>setNumber(e.target.value)} placeholder={placeholder} className={`input-field phone-number-force${err?" input-error":""}`}/>
    </div>
  );
}

function Input({value,onChange,placeholder,type="text",err=false,multiline=false,rows=4}){
  const cls=`input-field${err?" input-error":""}`;
  if(multiline)return<textarea value={value} onChange={onChange} placeholder={placeholder} rows={rows} className={cls} style={{resize:"none"}}/>;
  return<input type={type} value={value} onChange={onChange} placeholder={placeholder} className={cls}/>;
}
function Sel({value,onChange,opts,placeholder,err=false}){
  return<select value={value} onChange={onChange} className={`input-field${err?" input-error":""}`}><option value="">{placeholder}</option>{opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>;
}

          <div style={{display:"flex",gap:"24px",flexWrap:"wrap"}}>
            {t.footer.links.map((l,i)=><button key={l} onClick={()=>setPage(pages[i])} style={{fontFamily:"Inter,sans-serif",fontSize:"11px",letterSpacing:"0.15em",color:"rgba(5,5,5,0.38)",textTransform:"uppercase",background:"none",border:"none",cursor:"pointer",transition:"color 0.2s"}} onMouseEnter={e=>e.target.style.color="#C9A84C"} onMouseLeave={e=>e.target.style.color="rgba(5,5,5,0.25)"}>{l}</button>)}

        <div className="gold-line" style={{marginBottom:"24px",opacity:0.3}}/>
        <div style={{display:"flex",flexWrap:"wrap",justifyContent:"space-between",gap:"16px"}}>
          <p style={{fontFamily:"Inter,sans-serif",fontSize:"11px",color:"rgba(5,5,5,0.28)"}}>{t.footer.copy}</p>
          <p style={{fontFamily:"Inter,sans-serif",fontSize:"11px",color:"rgba(5,5,5,0.28)",maxWidth:"500px",lineHeight:"1.7"}}>{t.footer.note}</p>

  );

function LoadingScreen({show}){
  return <div className={`loading-screen${show?"":" hide"}`}>
    <div className="loading-inner">
      <div className="loading-title">Opulence Archive</div>
      <div className="loading-sub">Based in Switzerland</div>
      <div className="loading-mark"></div>
    </div>
  </div>;
}

function App(){
  const [lang,setLang]=useState("EN");
  const [page,setPage]=useState("home");
  const [cookie,setCookie]=useState(false);
  const [loading,setLoading]=useState(true);
  const [selectedCategoryKey,setSelectedCategoryKey]=useState("");
  const t=T[lang];

  useEffect(()=>{const timer=setTimeout(()=>setLoading(false),1800);return()=>clearTimeout(timer);},[]);
  useEffect(()=>{try{if(localStorage.getItem("oa-cookie-v3")==="1")setCookie(true);}catch(e){}});
  useEffect(()=>{window.scrollTo({top:0,behavior:"instant"});},[page]);

  const acceptCookie=()=>{try{localStorage.setItem("oa-cookie-v3","1");}catch(e){}setCookie(true);};

  const setPageAndScroll=(p)=>{setPage(p);window.scrollTo({top:0,behavior:"instant"});};

  const renderPage=()=>{
    if(page==="home")return<HomePage t={t} setPage={setPageAndScroll} lang={lang} onCategorySelect={setSelectedCategoryKey}/>;
    if(page==="sourcing")return<FormPage type="sourcing" t={t} setPage={setPageAndScroll} selectedCategoryKey={selectedCategoryKey}/>;
    if(page==="sell")return<FormPage type="sell" t={t} setPage={setPageAndScroll} selectedCategoryKey={selectedCategoryKey}/>;
    if(page==="members")return<MembersPage t={t} setPage={setPageAndScroll}/>;
    if(page==="about")return<AboutPage t={t} setPage={setPageAndScroll}/>;
    if(page==="contact")return<ContactPage t={t}/>;
    if(["privacy","terms","cookies","disclaimer"].includes(page))return<LegalPage type={page} lang={lang} t={t} setPage={setPageAndScroll}/>;
    return<HomePage t={t} setPage={setPageAndScroll} lang={lang} onCategorySelect={setSelectedCategoryKey}/>;
  };

  return(
    <div style={{minHeight:"100vh",background:"#fff"}}>
      <LoadingScreen show={loading}/>
      <Navbar lang={lang} setLang={setLang} page={page} setPage={setPageAndScroll} t={t}/>
      {renderPage()}
      <Footer t={t} setPage={setPageAndScroll}/>
      {!cookie&&<CookieBanner t={t} setPage={setPageAndScroll} onAccept={acceptCookie}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
