<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Opulence Archive — Coming Soon</title>
  <meta name="description" content="Opulence Archive is a Switzerland-based luxury sourcing platform. Stay tuned — coming soon." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://opulence-archive.ch/" />

  <meta property="og:title" content="Opulence Archive — Coming Soon" />
  <meta property="og:description" content="Worldwide sourcing of luxury assets. Based in Switzerland." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://opulence-archive.ch/" />
  <meta property="og:image" content="https://opulence-archive.ch/images/opulence-archive-logo.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Opulence Archive — Coming Soon" />
  <meta name="twitter:description" content="Worldwide sourcing of luxury assets. Based in Switzerland." />
  <meta name="twitter:image" content="https://opulence-archive.ch/images/opulence-archive-logo.png" />

  <meta name="theme-color" content="#050505" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Opulence Archive",
    "url": "https://opulence-archive.ch/",
    "logo": "https://opulence-archive.ch/images/opulence-archive-logo.png",
    "sameAs": ["https://www.instagram.com/opulence_archive"]
  }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      color: #f5f1e8;
    }

    body {
      font-family: "Inter", sans-serif;
    }

    main {
      width: 100vw;
      height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      position: relative;
      background:
        radial-gradient(circle at center, rgba(201,168,76,0.07), transparent 32%),
        linear-gradient(180deg, #070707 0%, #020202 100%);
    }

    main::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(201,168,76,0.12);
      pointer-events: none;
    }

    .content {
      position: relative;
      text-align: center;
      width: min(980px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(-8px);
    }

    .logo {
      width: min(720px, 92vw);
      max-height: 250px;
      object-fit: contain;
      margin-bottom: 30px;
      filter: drop-shadow(0 0 22px rgba(201,168,76,0.22));
    }

    .stay {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(34px, 5.2vw, 64px);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #d6b75b;
      margin-bottom: 18px;
    }

    .coming {
      font-size: clamp(13px, 2vw, 17px);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.68);
      margin-bottom: 42px;
    }

    .handle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #d6b75b;
      text-decoration: none;
      font-size: clamp(15px, 2.5vw, 20px);
      letter-spacing: 0.06em;
      border: 1px solid rgba(201,168,76,0.22);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.02);
    }

    .handle:hover {
      border-color: rgba(201,168,76,0.5);
      background: rgba(201,168,76,0.05);
    }

    .ig {
      width: 18px;
      height: 18px;
    }

    @media (max-width: 600px) {
      main {
        padding: 22px;
      }

      main::before {
        inset: 12px;
      }

      .logo {
        width: min(390px, 92vw);
        max-height: 150px;
        margin-bottom: 34px;
      }

      .stay {
        letter-spacing: 0.13em;
      }

      .coming {
        letter-spacing: 0.26em;
        margin-bottom: 34px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="content" aria-label="Opulence Archive coming soon">
      <img class="logo" src="images/opulence-archive-logo.png" alt="Opulence Archive" />

      <h1 class="stay">Stay Tuned</h1>
      <p class="coming">Coming Soon</p>

      <a class="handle" href="https://www.instagram.com/opulence_archive" target="_blank" rel="noopener noreferrer">
        <svg class="ig" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/>
        </svg>
        @opulence_archive
      </a>
    </section>
  </main>
</body>
</html>
